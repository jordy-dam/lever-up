<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lever-up</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lever-up">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1830; --card:#1b2a4d; --well:#12203f; --edge:rgba(255,255,255,.16); --ink:#eef2fb; --muted:#93a1c4; --glass:var(--card); --line:rgba(255,255,255,.12); --tint:rgba(255,255,255,.07); --vt:var(--ink);
  --accent:#c6f432; --accent-ink:#1a2305; --accent-soft:color-mix(in srgb,var(--accent) 14%,transparent); --accent-mid:color-mix(in srgb,var(--accent) 42%,transparent);
  --violet:#9b5cff; --blue:#3b82f6; --cyan:#35e0ff; --pink:#ff5ca8; --lime:#c6f432; --coral:#ff6b6b; --sun:#ffc933; --sky:#3fb8ff;
  --w:430px; --ew:1px; --sh:0px; --rl:16px; --r:12px; --rs:9px; --rx:6px; --dw:600;
  --display:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh;background:var(--bg)}
#app{position:relative;z-index:1;width:100%;max-width:var(--w);margin:0 auto;padding:14px 14px 130px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:20px}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);flex:none}
.face{position:relative;border-radius:50%;overflow:hidden;background:#e4e5e2;flex:none}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.brand h1{font-size:22px;line-height:1.1}
.rank{font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.rings{display:flex;gap:6px}
.rings i{width:14px;height:14px;border-radius:50%;background:var(--tint);display:block}
.rings i.on{background:var(--accent)}

.panel{background:var(--card);border:var(--ew) solid var(--edge);box-shadow:0 var(--sh) 0 var(--edge);border-radius:var(--r);padding:18px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:var(--rs);background:var(--accent);color:var(--accent-ink);border:var(--ew) solid var(--edge);box-shadow:0 var(--sh) 0 var(--edge);font-family:var(--display);font-weight:800;font-size:16px;transition:transform 120ms cubic-bezier(.23,1,.32,1)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink)}
.linkbtn{display:block;width:100%;min-height:48px;margin-top:8px;background:none;color:var(--muted);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.btn.lime{background:var(--accent);color:var(--accent-ink)}
.btn.full{width:100%}
.row{display:flex;gap:12px;align-items:center}
.seg{display:flex;gap:4px;margin-top:12px;padding:4px;background:var(--well);border:var(--ew) solid var(--edge);border-radius:var(--r)}
.seg button{flex:1;min-height:48px;border-radius:var(--rx);background:transparent;color:var(--muted);font-family:var(--display);font-weight:600;font-size:16px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=number],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--well);border:var(--ew) solid var(--edge);border-radius:var(--rs);padding:13px 14px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
label{display:block;font-weight:600;margin:12px 0 6px}

.ex{background:var(--card);border:var(--ew) solid var(--edge);box-shadow:0 var(--sh) 0 var(--edge);border-radius:var(--r);padding:16px;margin-bottom:16px}
.ex.done{box-shadow:0 0 0 2px var(--accent)}
.shots:not(:has(img)){display:none}
.sess{margin:0 0 16px}
.sess b{font-family:var(--display);font-size:16px;font-weight:700}
.sess .rbar{margin:8px 0 0}
.sesshead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;position:relative}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.shot{position:relative;aspect-ratio:4/3;max-height:max(110px,24vh);border-radius:var(--rx);background:var(--well);border:1px dashed rgba(255,255,255,.14);display:flex;align-items:flex-end;padding:8px 10px;color:var(--muted);font-size:12px;font-weight:600;overflow:hidden}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot:has(img){border-style:solid;border-color:transparent}
.shot:has(img) span{position:relative;background:rgba(14,24,48,.72);color:var(--ink);padding:2px 8px;border-radius:6px}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding:0}
.ex-head h3{min-width:0;font-size:18px;font-weight:700}
.ex-head span{flex:none;display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{width:48px;height:48px;border-radius:var(--rs);background:var(--well);border:var(--ew) solid var(--edge);box-shadow:0 calc(var(--sh)*.75) 0 var(--edge);color:var(--ink);font-family:var(--display);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;transition:transform 120ms cubic-bezier(.23,1,.32,1)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip.pop{animation:pop .3s cubic-bezier(.22,1,.36,1)}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}

.ex-open{display:block;width:100%;padding:0;background:none;text-align:left;color:inherit;border-radius:var(--rx)}
.backbtn{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 14px 0 6px;background:none;color:var(--ink);font-weight:700;font-size:16px;margin-bottom:4px}
.hero{display:flex;justify-content:center}
.heroin{position:relative;aspect-ratio:4/3;height:max(100px,min(26vh,190px));width:auto;max-width:100%;border-radius:var(--rs);background:var(--well);overflow:hidden;display:flex;align-items:flex-end;padding:10px;color:var(--muted);font-weight:600;font-size:13px}
.heroin img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.heroin img+img{animation:xfade 3.2s ease-in-out infinite}
.heroin:has(img) span{display:none}
@keyframes xfade{0%,40%{opacity:0}55%,90%{opacity:1}100%{opacity:0}}
.clock{font-family:var(--display);font-weight:800;font-size:36px;font-variant-numeric:tabular-nums;text-align:center;margin:8px 0 12px}
.clock span{color:var(--muted)}
.facts{display:grid;grid-template-columns:.65fr 1.35fr;gap:12px;align-items:center}
.facts dl{margin:0}
.facts dt{font-size:13px;color:var(--muted);font-weight:600}
.facts dd{margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:17px}
.mmap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mview{position:relative;aspect-ratio:1792/2400}
.ml{position:absolute;inset:0;background:rgba(255,255,255,.16);-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}
.ml.p{background:var(--accent)}
.ml.s{background:var(--accent-mid)}
.mkey{margin-top:14px;font-size:14px;line-height:1.5}
.mkey p{margin-bottom:4px}
.mkey p::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;background:var(--accent);vertical-align:-1px}
.mkey p.s::before{background:var(--accent-mid)}

.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(calc(var(--w) - 28px),calc(100% - 28px));display:flex;gap:4px;background:var(--card);border:var(--ew) solid var(--edge);box-shadow:0 var(--sh) 0 var(--edge);border-radius:var(--rl);padding:4px;z-index:4}
.bar button{flex:1;min-height:48px;background:transparent;border-radius:var(--rs);padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.bar button svg{width:24px;height:24px}
.bar button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(calc(var(--w) - 28px),calc(100% - 28px));background:var(--card);color:var(--accent);border:var(--ew) solid var(--accent);border-radius:var(--rs);padding:9px 16px;font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;text-align:center;display:none;z-index:5}
body:has(.timer.show) #app{padding-bottom:180px}
@media (min-width:640px){#app{background:color-mix(in srgb,var(--bg) 86%,transparent);border-inline:1px solid var(--line);min-height:100vh}}
.timer.show{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--rs);z-index:7;font-weight:600;display:none;align-items:center;gap:12px}
.toast.show{display:flex}
.tundo{position:relative;min-height:32px;padding:0 12px;border-radius:8px;background:var(--bg);color:var(--ink);font-weight:700;font-size:14px;flex:none;transition:transform 120ms cubic-bezier(.23,1,.32,1)}
.tundo::after{content:"";position:absolute;inset:-8px}
.tundo:active{transform:scale(.97)}

.carousel{position:relative;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -14px 16px;padding:14px calc(50% - 96px);scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.wrap{background:var(--accent-soft)}
.wrap .k{font-size:14px;font-weight:700;color:var(--accent)}
.kc{flex:none;width:220px;height:320px;scroll-snap-align:center;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--card);border:var(--ew) solid var(--edge);box-shadow:0 var(--sh) 0 var(--edge);border-radius:var(--rl);opacity:.92;transition:transform .25s cubic-bezier(.22,1,.36,1),opacity .25s,border-color .25s}
.carousel.picked .kc{opacity:.5;transform:scale(.92)}
.carousel.picked .kc.on{opacity:1;transform:none;box-shadow:0 0 0 3px var(--accent)}
.kc-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--tint)}
.dots i.on{background:var(--accent)}
.kc-pic{position:relative;flex:1;min-height:0;border-radius:var(--rs);background:var(--well);border:1px dashed rgba(255,255,255,.14);overflow:hidden}
.kc-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kc-name{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;text-align:center;text-wrap:balance}
.kc-amt{align-self:center;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 14px;font-family:var(--display);font-weight:700;font-size:16px}
.cmatrix{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cmatrix h4{margin:0 0 2px;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.mini{position:relative;aspect-ratio:3/4;border-radius:var(--rs);padding:6px;display:flex;align-items:flex-end;justify-content:center;text-align:center;font-size:12px;font-weight:600;line-height:1.15;background:var(--well);border:var(--ew) solid var(--edge);overflow:hidden}
.mini.got{background:var(--card);box-shadow:inset 0 0 0 2px var(--accent-mid)}
.mini.locked{border-style:dashed;color:transparent}
.mini.locked::before{content:"";position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid rgba(255,255,255,.2);border-radius:50%}
.mini b{position:absolute;right:4px;top:4px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);border-radius:999px;font-size:11px;min-width:20px;text-align:center;padding:0 5px}

svg text{font-family:var(--body);fill:var(--muted);font-size:10px}
.big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}

.rankbox{display:flex;align-items:center;gap:16px}
.lav{width:96px;height:96px;border:3px solid var(--accent)}
.rankbox .k{font-size:13px;font-weight:600;color:var(--muted)}
.rankbox h2{margin:2px 0 6px}
.rbar{height:8px;border-radius:99px;background:var(--tint);overflow:hidden;margin:8px 0 6px}
.rbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.streak{display:flex;align-items:center;gap:14px}
.streak .fl{width:44px;height:44px;color:var(--accent);flex:none}
.streak .nr{font-family:var(--display);font-weight:700;font-size:32px;line-height:1}
.week7{display:flex;justify-content:space-between;margin-top:16px}
.week7 span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.week7 i{width:26px;height:26px;border-radius:50%;background:var(--tint)}
.week7 i.on{background:var(--accent)}
.prog{text-align:center}
.prog .ringwrap{width:190px;margin:2px auto 4px}
.prog .ringwrap svg{width:100%;height:auto;display:block;}
.prog h2{margin:2px 0 14px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 16px}
.badge{background:var(--card);border:var(--ew) solid var(--edge);box-shadow:0 var(--sh) 0 var(--edge);border-radius:var(--rl);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;line-height:1.2}
.badge svg{width:60px;height:60px}
.badge.off{opacity:.8}
.badge small{font-weight:600;font-size:12px;color:var(--muted)}
.goals{text-align:left}
.goals li{align-items:center;gap:10px;justify-content:flex-start}
.goals .ck{width:26px;height:26px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:none}
.goals li.ok .ck{background:var(--accent);color:var(--accent-ink)}
.goals .n{margin-left:auto;color:var(--muted);font-weight:600}

.lvl{position:fixed;inset:0;background:rgba(14,24,48,.95);z-index:9;display:flex;align-items:center;justify-content:center;padding:24px}
.lvl .box{text-align:center;max-width:320px}
.lvl .hd{width:190px;height:190px;margin:0 auto;border:3px solid var(--accent)}
.lvl h2{font-size:44px;font-weight:800;margin:10px 0 6px}
.lvl p{margin-bottom:20px;font-size:18px}
.lvl p.q{font-size:16px;color:var(--muted);font-style:italic;margin:-6px 0 22px}
.lvl p.q small{display:block;margin-top:6px;font-style:normal;font-weight:700;color:var(--accent);font-size:13px}
.quote{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;font-style:italic}
.quote small{display:block;margin-top:4px;font-style:normal;font-weight:700;color:var(--accent)}

.err{color:#ffb4a8;font-weight:600;margin-top:8px}
input[aria-invalid="true"]{border-color:#ff8a7a}
.tune-b{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:6px;z-index:20;min-height:28px;padding:0 10px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;font-size:12px}
.tune{position:fixed;right:6px;top:calc(40px + env(safe-area-inset-top,0px));width:min(260px,calc(100% - 12px));z-index:20;background:var(--bg);border:1px solid var(--ink);border-radius:12px;padding:8px 10px;display:none;max-height:60vh;overflow:auto;font-size:12px}
.tune.open{display:block}
.tune h4{margin:8px 0 4px;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tune h4:first-child{margin-top:0}
.tune .o{display:flex;flex-wrap:wrap;gap:4px}
.tune .o button{min-height:28px;padding:0 8px;border-radius:8px;background:var(--card);border:1px solid var(--edge);font-weight:600;font-size:12px}
.tune .o button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tune .reset{margin-top:6px;background:none;color:var(--muted);text-decoration:underline;min-height:28px;font-size:12px}
h1,h2,h3,.btn,.chip,.clock,.kc-name,.big,.sess b,.facts dd,.nr,.kc-amt,.ex-head h3{font-weight:var(--dw)}
.pgms{display:grid;gap:8px}
.pgm{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:10px 14px;border-radius:var(--rs);background:var(--card);border:var(--ew) solid var(--edge);text-align:left}
.pgm b{font-family:var(--display);font-size:16px}
.pgm span{font-size:14px;color:var(--muted)}
.pgm[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.brow{padding:14px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0;padding-top:0}
.brow .l1{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:3;margin-top:16px;padding:12px 0 0;background:linear-gradient(to top,var(--bg) 75%,transparent)}
.savebar p{text-align:center;font-size:13px;margin-bottom:8px}
.bhead{display:flex;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px}
.bhead span:first-child{width:124px}
.brow .l1 b{min-width:0;font-weight:600}
.brow .l2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ib{width:40px;height:40px;border-radius:var(--rs);background:var(--well);border:var(--ew) solid var(--edge);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none;position:relative;transition:transform 120ms cubic-bezier(.23,1,.32,1)}
.ib::after,.btn.sm::after{content:"";position:absolute;inset:-4px}
.btn.sm::after{inset:-6px}
.ib:active{transform:scale(.94)}
.ib:disabled{opacity:.35}
.ib.x{background:none;border-color:transparent;color:var(--muted)}
.sets{min-width:20px;text-align:center;font-family:var(--display);font-weight:700;font-size:16px}
.brow .reps{width:64px;flex:none;height:40px;text-align:center;font-weight:600;font-size:16px;padding:0 6px}
.libitem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:8px 0;background:none;border-top:1px solid var(--line);text-align:left}
.libitem:first-child{border-top:0}
.libitem span{color:var(--muted);font-size:14px;white-space:nowrap}
.fold{padding:0 18px}
.fold summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;list-style:none;cursor:pointer;font-family:var(--display);font-weight:600;font-size:16px}
.fold summary::-webkit-details-marker{display:none}
.fold summary span{color:var(--muted);font-family:var(--body);font-weight:500;font-size:14px;margin-left:auto}

}

  if(dbRef){

    saveTimer=setTimeout(function(){
      try{dbRef.set({json:JSON.stringify(S)}).catch(function(){});}catch(e){}

}
function initDb(){
  if(DEMO)return;
  if(!window.claude||!window.claude.use) return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user) return null;
    return user.id().then(function(id){
      if(!id) return;
      dbRef=db.collection("data/users/"+id).doc("state");

        if(snap.exists){

/* ================= helpers ================= */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return n<10?"0"+n:""+n;}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}

function weekStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function parseYmd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function toast(t,undo){

  if(undo){var b=document.createElement("button");b.type="button";b.className="tundo";b.textContent="Ongedaan";b.addEventListener("click",function(){clearTimeout(toast._t);el.classList.remove("show");undo();});el.appendChild(b);}

function nextType(){return !S.sessions.length?"A":(S.sessions[S.sessions.length-1].type==="A"?"B":"A");}

}
function nlDate(s){return parseYmd(s).toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"});}
function weekCounts(){var c={};S.sessions.forEach(function(x){var k=ymd(weekStart(parseYmd(x.date)));c[k]=(c[k]||0)+1;});return c;}

/* ================= confetti ================= */
function confetti(){

function bindCarousel(){

function chart(avgs){
  var pts=avgs.slice(-8);
  if(pts.length<2)return '<p class="muted">Je grafiek verschijnt zodra je twee weken hebt gewogen.</p>';
  var W=320,H=140,pl=30,pr=12,pt=12,pb=22,vals=pts.map(function(p){return p.avg;});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mx-mn<1){mx+=.5;mn-=.5;}
  function X(i){return pl+(W-pl-pr)*i/(pts.length-1);}
  function Y(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));}
  var line=pts.map(function(p,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.avg).toFixed(1);}).join(" ");
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Weekgemiddelde gewicht">';
  s+='<text x="0" y="'+(pt+8)+'">'+mx.toFixed(1)+'</text><text x="0" y="'+(H-pb)+'">'+mn.toFixed(1)+'</text>';
  s+='<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.avg).toFixed(1)+'" r="4.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>';});
  return s+'</svg>';
}

function ensureDraft(type){if(!S.draft||S.draft.type!==type)S.draft={type:type,done:{}};}

  var b=ev.target.closest("[data-act]");if(!b)return;

  if(act==="type"){
    if(S.draft&&Object.keys(S.draft.done).length&&S.draft.type!==v&&!confirm("Je huidige sessie wordt gewist. Doorgaan?"))return;
    S.draft={type:v,done:{}};save();render();return;
  }
  if(act==="set"){
    var type=S.draft?S.draft.type:nextType();ensureDraft(type);
    var i=+b.getAttribute("data-i"),s=+b.getAttribute("data-s");
    var arr=S.draft.done[i]||[];arr[s]=!arr[s];S.draft.done[i]=arr;
    lastTap=arr[s]?i+"-"+s:null;

    if(arr[s])startRest(90);

  }
  if(act==="finish"){finishSession();return;}
  if(act==="runstart"){runStart();return;}
  if(act==="runstop"){if(history.state&&history.state.lu==="r"){history.back();return;}runExit();render();return;}

  if(act==="rstart"){if(runT.state==="idle"){startPrep();}else{clearInterval(runT.iv);runT.iv=0;runT.state="idle";render();}return;}
  if(act==="rskip"){var ps=runPos();if(!ps)return;ensureDraft(ps.type);if(!S.draft.skip)S.draft.skip={};S.draft.skip[ps.i]=true;save();stopRunTimers();runPhase="work";if(!runPos()){var any=false;Object.keys(S.draft.done).forEach(function(k){S.draft.done[k].forEach(function(x){if(x)any=true;});});if(any){finishSession();}else{runExit();render();}return;}render();window.scrollTo(0,0);autoStartTimed();return;}
  if(act==="radd30"){runRest.end+=30000;runRest.total+=30;tickRest();return;}
  if(act==="rnext"){endRest(false);return;}
  if(act==="rundo"){if(runLast&&S.draft&&S.draft.done[runLast.i]){S.draft.done[runLast.i][runLast.k]=false;save();}stopRunTimers();runPhase="work";runLast=null;render();window.scrollTo(0,0);autoStartTimed();return;}
  if(act==="obname"){var nv=document.getElementById("obname").value.trim().slice(0,20);S.profile=S.profile||{};S.profile.name=nv;save();obStep=2;render();window.scrollTo(0,0);return;}
  if(act==="obprog"||act==="obown"){var g0=PROGRAMS[act==="obprog"?+v:0];S.plan={A:g0.A.map(function(id){return entryFrom(cardById(id));}),B:g0.B.map(function(id){return entryFrom(cardById(id));})};S.draft=null;save();if(act==="obown"){S.onboarded=true;save();tab="today";bld=JSON.parse(JSON.stringify(S.plan));bldType="A";bldLib=false;bldProg=-1;render();window.scrollTo(0,0);return;}obStep=3;render();window.scrollTo(0,0);return;}
  if(act==="obdone"){S.onboarded=true;save();tab="today";render();window.scrollTo(0,0);return;}
  if(act==="open"){detail=+b.getAttribute("data-i");try{history.pushState({lu:"d"},"");}catch(e){}render();window.scrollTo(0,0);return;}
  if(act==="close"){stopTimer();if(history.state&&history.state.lu==="d"){history.back();return;}detail=null;render();return;}
  if(act==="tstart"){runTimer(+v);return;}
  if(act==="trest"){startRest(90);return;}
  if(act==="edit"){detail=null;bld=JSON.parse(JSON.stringify(S.plan));bldType=S.draft?S.draft.type:nextType();bldLib=false;bldProg=-1;render();window.scrollTo(0,0);return;}
  if(act==="bcancel"){dropBuilder();render();return;}
  if(act==="bty"){bldType=v;render();return;}
  if(act==="bprog"){var g=PROGRAMS[+v],sn=snapB();bld={A:g.A.map(function(id){return entryFrom(cardById(id));}),B:g.B.map(function(id){return entryFrom(cardById(id));})};bldProg=+v;render();toast("Programma "+g.n+" geladen",function(){restoreB(sn);});return;}
  if(act==="bstep"){var e1=bld[bldType][+b.getAttribute("data-i")];e1.sets=Math.min(10,Math.max(1,e1.sets+(+v)));bldProg=-1;render();return;}
  if(act==="bmove"){var ls=bld[bldType],i1=+b.getAttribute("data-i"),j1=i1+(+v);if(j1<0||j1>=ls.length)return;var t1=ls[i1];ls[i1]=ls[j1];ls[j1]=t1;render();return;}
  if(act==="bdel"){var sn2=snapB();bld[bldType].splice(+b.getAttribute("data-i"),1);bldProg=-1;render();toast("Oefening verwijderd",function(){restoreB(sn2);});return;}
  if(act==="blib"){bldLib=!bldLib;render();return;}
  if(act==="bsuit"){bldSuit=v;render();return;}
  if(act==="badd"){bld[bldType].push(entryFrom(cardById(v)));render();toast("Toegevoegd aan sessie "+bldType);return;}
  if(act==="bown"){var nm=document.getElementById("own").value.trim();if(!nm){toast("Geef de oefening een naam");return;}bld[bldType].push({n:nm,sets:3,reps:"8"});render();return;}
  if(act==="bsave"){
    if(!bld.A.length||!bld.B.length){toast("Beide sessies hebben minstens één oefening nodig");return;}
    S.plan={A:bld.A,B:bld.B};S.draft=null;save();bld=null;toast("Plan opgeslagen");render();window.scrollTo(0,0);return;
  }
  if(act==="level"){drawLevel=+v;drawn=null;render();return;}
  if(act==="draw"){
    var pool=DECK.filter(function(c){return c.l===drawLevel&&(!drawn||c.id!==drawn.id);});
    drawn=pool[Math.floor(Math.random()*pool.length)];
    var cur=document.querySelector(".kc");
    if(!cur){render();return;}
    autoScroll=true;
    document.getElementById("carousel").classList.add("picked");
    [].forEach.call(document.querySelectorAll(".kc"),function(k){k.classList.toggle("on",k.getAttribute("data-id")===drawn.id);});
    centerCard(drawn.id,true);
    setTimeout(function(){autoScroll=false;render();},REDUCE?0:500);
    return;
  }
  if(act==="done"){
    if(!drawn)return;
    S.cards[drawn.id]=(S.cards[drawn.id]||0)+1;(S.cardLog=S.cardLog||[]).push(today());save();
    var again=S.cards[drawn.id]>1;toast(pick(CARD_LINES)+(again?" ("+S.cards[drawn.id]+"e keer)":""));wrap=null;drawn=null;render();return;
  }
});
window.addEventListener("popstate",function(){
  if(running){runExit();render();window.scrollTo(0,0);return;}
  if(detail!==null){stopTimer();detail=null;render();window.scrollTo(0,0);}
});
document.getElementById("app").addEventListener("change",function(ev){
  var f=ev.target;if(!bld||!f.matches||!f.matches("[data-f=reps]"))return;
  var v=f.value.trim().toLowerCase().replace(/\s+/g,"");
  if(!/^\d{1,3}s?$/.test(v)||+v.replace("s","")<1){toast("Gebruik een getal, of een tijd zoals 20s");f.value=bld[bldType][+f.getAttribute("data-i")].reps;return;}
  bld[bldType][+f.getAttribute("data-i")].reps=v;f.value=v;
});
document.getElementById("app").addEventListener("submit",function(ev){
  var f=ev.target.closest("[data-form=weigh]");if(!f)return;ev.preventDefault();
  var inp=document.getElementById("kg"),err=document.getElementById("kgerr");
  var kg=parseFloat(String(inp.value).replace(",","."));
  if(!(kg>=20&&kg<=400)){inp.setAttribute("aria-invalid","true");err.textContent="Voer een gewicht tussen 20 en 400 kg in.";err.hidden=false;inp.focus();return;}
  var td=today(),had=S.weights.some(function(w){return w.date===td;});
  S.weights=S.weights.filter(function(w){return w.date!==td;});
  S.weights.push({date:td,kg:Math.round(kg*10)/10});
  S.weights.sort(function(x,y){return x.date<y.date?-1:1;});
  save();toast(had?"Gewicht van vandaag bijgewerkt":"Gewicht opgeslagen");render();
});


/* ================= look-paneel (?tune): live lettertype, dikte, rand, schaduw en ronding kiezen ================= */
(function(){
  var K="lever-look-3",FONTS={"Figtree":'"Figtree"'};
  var RADII={"Scherp":["10px","8px","6px","4px"],"Middel":["16px","12px","9px","6px"],"Rond":["22px","18px","14px","10px"]};
  var ACC={"Mint":["#2fd0a0","#06231b"],"Lime":["#c6f432","#1a2305"],"Hemel":["#4aa8ff","#04162b"],"Oranje":["#ff9f5a","#2a1200"]};
  var SURF={"Marine":["#0e1830","#1b2a4d","#12203f"],"Diep":["#080f1d","#131f38","#0b1528"],"Leisteen":["#10151d","#1d2533","#151b26"],"Blauw":["#10284f","#1e3d73","#163260"]};
  var cur={font:"Figtree",weight:"600",radius:"Middel",edge:"1",shadow:"0",accent:"Lime",surface:"Marine"};
  try{var sv=JSON.parse(localStorage.getItem(K)||"null");if(sv)for(var k in sv)cur[k]=sv[k];}catch(e){}
  function apply(){
    var st=document.documentElement.style,r=RADII[cur.radius]||RADII.Rond;
    st.setProperty("--display",FONTS[cur.font]+',"Figtree",system-ui,sans-serif');
    st.setProperty("--dw",cur.weight);st.setProperty("--ew",cur.edge+"px");st.setProperty("--sh",cur.shadow+"px");
    st.setProperty("--rl",r[0]);st.setProperty("--r",r[1]);st.setProperty("--rs",r[2]);st.setProperty("--rx",r[3]);
    var a=ACC[cur.accent]||ACC.Mint,f=SURF[cur.surface]||SURF.Marine;
    st.setProperty("--accent",a[0]);st.setProperty("--accent-ink",a[1]);st.setProperty("--bg",f[0]);st.setProperty("--card",f[1]);st.setProperty("--well",f[2]);
    try{localStorage.setItem(K,JSON.stringify(cur));}catch(e){}
  }
  apply();
  if(!/[?&]tune/.test(location.search))return;
  var b=document.createElement("button");b.className="tune-b";b.textContent="Look";b.setAttribute("aria-expanded","false");
  var p=document.createElement("div");p.className="tune";
  function group(title,key,opts){
    var h='<h4>'+title+'</h4><div class="o">';
    opts.forEach(function(o){h+='<button data-k="'+key+'" data-v="'+o[0]+'" aria-pressed="'+(String(cur[key])===String(o[0]))+'">'+o[1]+'</button>';});
    return h+'</div>';
  }
  function draw(){
    p.innerHTML=group("Accentkleur","accent",Object.keys(ACC).map(function(k){return [k,k];}))+
      group("Achtergrond en kaarten","surface",Object.keys(SURF).map(function(k){return [k,k];}))+
      group("Dikte letters","weight",[["600","Medium"],["700","Dik"],["800","Extra dik"]])+
      group("Ronding","radius",Object.keys(RADII).map(function(r){return [r,r];}))+
      group("Rand","edge",[["0","Geen"],["1","Dun"],["2","Middel"]])+
      group("Schaduw","shadow",[["0","Geen"],["3","Klein"],["4","Middel"],["6","Groot"]])+
      '<button class="reset" data-k="reset">Terug naar standaard</button>';
  }
  p.addEventListener("click",function(e){
    var t=e.target.closest("[data-k]");if(!t)return;
    if(t.getAttribute("data-k")==="reset")cur={font:"Figtree",weight:"600",radius:"Middel",edge:"1",shadow:"0",accent:"Lime",surface:"Marine"};
    else cur[t.getAttribute("data-k")]=t.getAttribute("data-v");
    apply();draw();
  });
  b.addEventListener("click",function(){var o=p.classList.toggle("open");b.setAttribute("aria-expanded",o);});
  draw();document.body.appendChild(p);document.body.appendChild(b);
})();
